name: Test Docker Build

on:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  dockerfile-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Dockerfiles exist
        run: |
          test -f docker/Dockerfile

      - name: Verify Dockerfiles define base images
        run: |
          grep -q '^FROM ' docker/Dockerfile
          if [ -f docker/Dockerfile.gcp-ce ]; then
            grep -q '^FROM ' docker/Dockerfile.gcp-ce
          fi